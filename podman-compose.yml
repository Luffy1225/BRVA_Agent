version: '3.8'

services:
  aero-agent:
    build:
      context: .
      dockerfile: Containerfile
    image: aeroagent:v1
    container_name: aeroagent-app
    env_file:
      - .env
    ports:
      - "8501:8501"
    stdin_open: true
    tty: true
    command: ["python", "-m", "streamlit", "run", "src/ui/web.py", "--server.port=8501", "--server.address=0.0.0.0"]
